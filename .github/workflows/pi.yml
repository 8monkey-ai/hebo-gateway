name: Pi AI Agent

on:
  issue_comment:
    types: [created]

  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pi-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  pi-agent:
    if: >-
      (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '/pi ') &&
          (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
          )
      ) ||
      (
          github.event_name == 'pull_request_review' &&
          startsWith(github.event.review.body, '/pi ') &&
          (
          github.event.review.author_association == 'OWNER' ||
          github.event.review.author_association == 'MEMBER' ||
          github.event.review.author_association == 'COLLABORATOR'
          )
      )

    runs-on: ubuntu-latest

    steps:
      # Checkout the trusted default branch rather than untrusted PR code.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@v2.26.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          provider: amazon-bedrock
          model: us.anthropic.claude-opus-4-8
          thinking_level: high
          export_session_html: true
          diff_ignore_patterns: "dist/ pnpm-lock.yaml node_modules/"

      - name: Upload Pi session HTML
        uses: actions/upload-artifact@v7
        if: ${{ steps.pi.outputs.session_html_path }}
        with:
          name: pi-session-html-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
          path: ${{ steps.pi.outputs.session_html_path }}
