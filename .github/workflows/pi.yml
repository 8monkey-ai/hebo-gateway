name: Pi AI Agent

on:
  workflow_call:
    inputs:
      prompt:
        type: string
        required: false
      allowed_actor:
        type: string
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  pi-agent:
    if: |
      (startsWith(github.event.comment.body, '/pi ') || startsWith(github.event.review.body, '/pi ')) &&
      (inputs.allowed_actor == '' || github.actor == inputs.allowed_actor)

    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@develop
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BEDROCK_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.BEDROCK_REGION }}
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          provider: amazon-bedrock
          model: us.anthropic.claude-opus-5
          thinking_level: high
          prompt: ${{ inputs.prompt }}
          diff_ignore_patterns: "dist/ pnpm-lock.yaml node_modules/"

      - uses: actions/upload-artifact@v7
        if: ${{ steps.pi.outputs.session_html_path }}
        with:
          name: pi-session-html-${{ github.event.issue.number || github.event.pull_request.number || github.run_number }}
          path: ${{ steps.pi.outputs.session_html_path }}
